name: Bug report
description: Something doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please leave out license keys, license request strings and customer data: issues here are public.
  - type: textarea
    id: environment
    attributes:
      label: Versions and system
      description: |
        forceInstaller's **Report a problem** copied these lines to your clipboard: paste them here, and add your operating system's version (for example Windows 11 24H2 or Ubuntu 24.04).
        Otherwise give the app version (on its card in forceInstaller), the forceInstaller version (top of its Settings, or "not used"), the operating system with its version, and the architecture (x64, ARM64, x86 or RISC-V).
      placeholder: |
        App: forceVector 1.4.0
        forceInstaller: 0.16.1
        Operating system: Windows 11 24H2
        Architecture: x64
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The exact error message, if there was one. Screenshots help too.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        forceInstaller's log is `forceinstaller.log` in its `logs` folder:
        Windows `%LOCALAPPDATA%\forceInstaller\logs`, Linux `~/.local/share/forceinstaller/logs`.
        Paste the lines around the problem, or attach the file. Check them for anything private first.
      render: text
