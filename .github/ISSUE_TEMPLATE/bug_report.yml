name: Bug report
description: Something doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. forceInstaller's **Report a problem** link fills in the versions and the system for you.
        Please leave out license keys, license request strings and customer data: issues here are public.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version on the app's card in forceInstaller (for forceInstaller itself, the version in its Settings).
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: forceInstaller version
      description: Shown at the top of forceInstaller's Settings. Write "not used" if you installed the app another way.
      placeholder: "0.16.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version, for example Windows 11 24H2 or Ubuntu 24.04.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: x64, ARM64, x86 or RISC-V ("I don't know" is fine).
      placeholder: "x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The exact error message, if there was one. Screenshots help too.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        forceInstaller's log is `forceinstaller.log` in its `logs` folder:
        Windows `%LOCALAPPDATA%\forceInstaller\logs`, Linux `~/.local/share/forceinstaller/logs`.
        Paste the lines around the problem, or attach the file. Check them for anything private first.
      render: text
