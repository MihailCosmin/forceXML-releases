name: Feature request
description: Suggest something new or a change to how something works.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please leave out license keys and customer data: issues here are public.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should work, from your point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use now, or other ways it could be solved.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version you use now, if it matters for the request.
      placeholder: "1.4.0"
